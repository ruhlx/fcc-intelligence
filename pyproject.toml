[tool.poetry]
name = "fcc-intelligence"
version = "0.1.0"
description = "FCC Regulatory Contact Intelligence Platform — extract product-compliance contacts from FCC Equipment Authorization filings."
authors = ["Reto Uhl <reto.uhl@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
psycopg = { extras = ["binary"], version = "^3.2.3" }
pydantic = "^2.9.2"
pydantic-settings = "^2.6.0"
httpx = "^0.27.2"
beautifulsoup4 = "^4.12.3"
pdfplumber = "^0.11.4"
pypdf = "^5.1.0"
pymupdf = "^1.24.11"
openai = "^1.54.0"
google-genai = "^1.0.0"
structlog = "^24.4.0"
tenacity = "^9.0.0"
python-multipart = "^0.0.12"

[tool.poetry.group.ocr.dependencies]
pytesseract = "^0.3.13"
pillow = "^11.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.24.0"
respx = "^0.21.1"
ruff = "^0.7.1"
mypy = "^1.13.0"
types-beautifulsoup4 = "^4.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main.py", "alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults is idiomatic
    "UP042",  # str + Enum is an intentional, well-understood pattern here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N818", "C408"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_decorators = false
